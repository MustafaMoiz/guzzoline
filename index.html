<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barometer</title>
  </head>
  <body>
    <header class="controls">
      <div class="row">
        <div class="group" id="scenarios" role="group" aria-label="Scenario"></div>
        <div class="group">
          <button type="button" id="working" aria-pressed="false">Working</button>
          <div class="group joined" role="group" aria-label="Numbers show">
            <button type="button" data-show="left" aria-pressed="true">Left</button>
            <button type="button" data-show="used" aria-pressed="false">Used</button>
          </div>
          <button type="button" id="lapse" aria-pressed="false">Time-lapse</button>
        </div>
      </div>
      <div class="row sliders">
        <label><span id="aName"></span> used <input type="range" id="aUsed" min="0" max="100" step="1" /> <output id="aUsedOut"></output></label>
        <label>resets in <input type="range" id="aReset" min="1" max="300" step="1" /> <output id="aResetOut"></output></label>
        <label><span id="bName"></span> used <input type="range" id="bUsed" min="0" max="100" step="1" /> <output id="bUsedOut"></output></label>
        <label>resets in <input type="range" id="bReset" min="1" max="168" step="1" /> <output id="bResetOut"></output></label>
      </div>
    </header>
    <main id="themes"></main>
    <div id="notice" class="notice" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
